manifest_version: 2
name: hermes-personal-agent
version: "0.1.0"
description: Hermes-native foundation with an opt-in local task inbox
author: MosBot.AI
license: MIT
homepage: https://github.com/MosBot-AI/hermes-superagent
kind: standalone
provides_tools:
  - personal_agent_status
config_schema:
  mode:
    type: str
    default: read_only
    description: read_only (default) or local_tasks for explicit local CLI storage only.
