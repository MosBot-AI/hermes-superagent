manifest_version: 2
name: hermes-personal-agent
version: "0.1.0"
description: Hermes-native foundation with an opt-in local task inbox
author: MosBot.AI
license: MIT
homepage: https://github.com/MosBot-AI/hermes-superagent
kind: standalone
capabilities:
  - llm.text_worker
provides_tools:
  - personal_agent_status
  - personal_tasks_read
  - personal_tasks_write
  - personal_memory_read
  - personal_memory_write
  - personal_memory_candidate
  - personal_task_plan_preview
config_schema:
  mode:
    type: str
    default: read_only
    description: read_only (default) or local_tasks for explicit local task storage; conversation entry is separately opt-in.
  planning_blueprint:
    type: bool
    default: false
    description: Opt in to a native planning check-in template; does not create a cron job.
  local_conversation:
    type: bool
    default: false
    description: Opt in to trusted single-user native LOCAL session commands; requires local_tasks mode.
  local_model_tools:
    type: bool
    default: false
    description: Allow native in-process task tools after explicit session activation; requires local_conversation.
  plan_worker:
    type: bool
    default: false
    description: Opt in to one-task planning drafts only on an explicitly consenting host with hermes.text-worker.v1; requires local_model_tools. Each selected task needs a separate short-lived grant to OpenCode Go deepseek-v4.1-flash. No fallback, task completion or tool execution.
  local_memory:
    type: bool
    default: false
    description: Opt in to explicit native LOCAL memory commands; requires local_conversation, preserves native providers and performs no automatic recall or extraction.
  memory_model_tools:
    type: bool
    default: false
    description: Allow native in-process memory tools after separate explicit session activation; optional recall-on supplies fresh bounded context each turn, preserves native providers and sends records to the configured model.
  memory_candidates:
    type: bool
    default: false
    description: Allow separately activated candidate-on drafting from current native turn input; requires memory_model_tools. Drafts require native review before becoming memory, with seven-day lazy payload expiry; no extra model or provider replacement.
  kanban_handoff:
    type: bool
    default: false
    description: Opt in to explicit preview/commit of parked native Kanban cards; requires local_tasks, local_conversation and an explicit board. Does not dispatch workers.
  kanban_handoff_board:
    type: str
    default: ""
    description: Exact native shared-board slug, including explicit default; no implicit board selection. Validated at registration and again for operations.
