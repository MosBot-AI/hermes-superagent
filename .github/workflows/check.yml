name: Foundation checks

on:
  pull_request:
  push:
    branches: [main, 'feat/**']

permissions:
  contents: read

jobs:
  checkpoint-source-proposal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.9'
      - name: Prepare the pinned Hermes test environment
        shell: bash
        run: |
          set -euo pipefail
          upstream="$RUNNER_TEMP/hermes"
          git init "$upstream"
          git -C "$upstream" remote add origin https://github.com/NousResearch/hermes-agent.git
          git -C "$upstream" fetch --depth=1 origin 2281116525106e3c109993ccb5dc74d02bfc1427
          git -C "$upstream" checkout --detach FETCH_HEAD
          export HERMES_HOME="$RUNNER_TEMP/hermes-build-home"
          export HERMES_RUNTIME_DIR="$RUNNER_TEMP/hermes-build-runtime"
          cd "$upstream"
          python -m pm.build_env --source . --out "$RUNNER_TEMP/hermes-test-venv" \
            --group dev --group test --python "$(command -v python)"
      - name: Verify checkpoint source receipts on a disposable proposed host
        shell: bash
        run: |
          set -euo pipefail
          proposed="$RUNNER_TEMP/hermes-checkpoint-source-proposal"
          artifact="$GITHUB_WORKSPACE/experiments/native-checkpoint-sources"
          git -C "$RUNNER_TEMP/hermes" worktree add --detach "$proposed" 2281116525106e3c109993ccb5dc74d02bfc1427
          git -C "$proposed" apply --check "$artifact/native-checkpoint-sources.patch"
          git -C "$proposed" apply --index "$artifact/native-checkpoint-sources.patch"
          "$RUNNER_TEMP/hermes-test-venv/bin/python" "$artifact/run_tests.py" \
            --checkout "$proposed" --python "$RUNNER_TEMP/hermes-test-venv/bin/python"
  native-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.9'
      - name: Prepare the pinned Hermes test environment
        shell: bash
        run: |
          set -euo pipefail
          upstream="$RUNNER_TEMP/hermes"
          git init "$upstream"
          git -C "$upstream" remote add origin https://github.com/NousResearch/hermes-agent.git
          git -C "$upstream" fetch --depth=1 origin 2281116525106e3c109993ccb5dc74d02bfc1427
          git -C "$upstream" checkout --detach FETCH_HEAD
          export HERMES_HOME="$RUNNER_TEMP/hermes-build-home"
          export HERMES_RUNTIME_DIR="$RUNNER_TEMP/hermes-build-runtime"
          cd "$upstream"
          python -m pm.build_env --source . --out "$RUNNER_TEMP/hermes-test-venv" \
            --group dev --group test --python "$(command -v python)"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.12.1'
          package-manager-cache: false
      - name: Check the plugin, native contracts and Desktop routes
        shell: bash
        run: |
          "$RUNNER_TEMP/hermes-test-venv/bin/python" scripts/check.py \
            --hermes "$RUNNER_TEMP/hermes" \
            --hermes-python "$RUNNER_TEMP/hermes-test-venv/bin/python" \
            --hermes-node "$(command -v node)"
      - name: Verify exact-key cron creation on a disposable proposed host
        shell: bash
        run: |
          set -euo pipefail
          proposed="$RUNNER_TEMP/hermes-cron-create-proposal"
          git -C "$RUNNER_TEMP/hermes" worktree add --detach "$proposed" 2281116525106e3c109993ccb5dc74d02bfc1427
          git -C "$proposed" apply --check "$GITHUB_WORKSPACE/experiments/cron-create-requests/cron-create-requests.patch"
          git -C "$proposed" apply --index "$GITHUB_WORKSPACE/experiments/cron-create-requests/cron-create-requests.patch"
          "$RUNNER_TEMP/hermes-test-venv/bin/python" experiments/cron-create-requests/run_tests.py \
            --checkout "$proposed" --python "$RUNNER_TEMP/hermes-test-venv/bin/python"
      - name: Verify gated worker on separate disposable proposed host
        shell: bash
        run: |
          set -euo pipefail
          # Review-only current-pin candidate; never modifies the clean compatibility host.
          proposed="$RUNNER_TEMP/hermes-text-worker"
          git -C "$RUNNER_TEMP/hermes" worktree add --detach "$proposed" 2281116525106e3c109993ccb5dc74d02bfc1427
          git -C "$proposed" apply --check "$GITHUB_WORKSPACE/experiments/text-worker/text-worker-prototype.patch"
          git -C "$proposed" apply --index "$GITHUB_WORKSPACE/experiments/text-worker/text-worker-prototype.patch"
          "$RUNNER_TEMP/hermes-test-venv/bin/python" experiments/text-worker/run_tests.py \
            --checkout "$proposed" --clean-checkout "$RUNNER_TEMP/hermes" \
            --python "$RUNNER_TEMP/hermes-test-venv/bin/python" --disposable-copy
      - name: Build and verify the offline runtime delivery
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          umask 022
          source_sha="$(git --no-replace-objects rev-parse HEAD)"
          test "$source_sha" = "$EXPECTED_SOURCE_SHA"
          python="$RUNNER_TEMP/hermes-test-venv/bin/python"
          delivery="$RUNNER_TEMP/hermes-runtime-delivery"
          mkdir "$delivery" "$RUNNER_TEMP/runtime-extracted"
          for copy in one two; do
            package="$RUNNER_TEMP/runtime-$copy"
            "$python" scripts/build_runtime_distribution.py \
              --source-commit "$source_sha" --output-dir "$package"
            "$python" scripts/build_runtime_distribution.py \
              --source-commit "$source_sha" --output-dir "$package" \
              --archive-file "$RUNNER_TEMP/runtime-$copy.tar.gz"
          done
          cmp "$RUNNER_TEMP/runtime-one.tar.gz" "$RUNNER_TEMP/runtime-two.tar.gz"
          cp "$RUNNER_TEMP/runtime-one.tar.gz" "$delivery/hermes-personal-agent.tar.gz"
          tar -xzf "$delivery/hermes-personal-agent.tar.gz" -C "$RUNNER_TEMP/runtime-extracted"
          "$python" scripts/check_runtime_distribution.py \
            --repo "$GITHUB_WORKSPACE" --source-commit "$source_sha" \
            --package "$RUNNER_TEMP/runtime-extracted/hermes-personal-agent" \
            --hermes "$RUNNER_TEMP/hermes" --hermes-python "$python" \
            --report "$delivery/VALIDATION.json"
          cd "$delivery"
          sha256sum hermes-personal-agent.tar.gz VALIDATION.json > SHA256SUMS
      - name: Upload the verified runtime package, not an installation
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hermes-personal-agent-runtime-${{ github.sha }}
          path: ${{ runner.temp }}/hermes-runtime-delivery/
          if-no-files-found: error
          retention-days: 30
