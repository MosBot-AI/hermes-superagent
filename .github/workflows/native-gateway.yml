name: Native Gateway acceptance

# Manual only: no live Gateway starts on pull requests or pushes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.9'
      - name: Prepare the pinned Hermes test environment
        shell: bash
        run: |
          set -euo pipefail
          upstream="$RUNNER_TEMP/hermes"
          git init "$upstream"
          git -C "$upstream" remote add origin https://github.com/NousResearch/hermes-agent.git
          git -C "$upstream" fetch --depth=1 origin 2281116525106e3c109993ccb5dc74d02bfc1427
          git -C "$upstream" checkout --detach FETCH_HEAD
          export HERMES_HOME="$RUNNER_TEMP/hermes-build-home"
          export HERMES_RUNTIME_DIR="$RUNNER_TEMP/hermes-build-runtime"
          cd "$upstream"
          python -m pm.build_env --source . --out "$RUNNER_TEMP/hermes-test-venv" \
            --group dev --group test --python "$(command -v python)"
      - name: Verify native Bot, Webapp, managed worker and cron cases
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          upstream="$RUNNER_TEMP/hermes"
          test_python="$RUNNER_TEMP/hermes-test-venv/bin/python"
          pin="$(python -c 'import json; print(json.load(open("compatibility.json"))["hermes_commit"])')"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C "$upstream" rev-parse HEAD)" = "$pin"
          mkdir -p "$RUNNER_TEMP/native-gateway-evidence"
          for fixture in bot_receipt profile_retirement profile_rename profile_recreate webapp_restore_rotation history_adoption webapp_signout managed_worker managed_worker_restart managed_worker_stop cron_bot_deferred; do
            sandbox="$(mktemp -d "$RUNNER_TEMP/native-bot.XXXXXX")"
            mkdir -p "$sandbox/home" "$sandbox/tmp"
            receipt="${fixture//_/-}.xml"
            result="$sandbox/$receipt"
            env -i PATH="$PATH" LANG=C.UTF-8 HOME="$sandbox/home" TMPDIR="$sandbox/tmp" \
              XDG_CONFIG_HOME="$sandbox/config" XDG_CACHE_HOME="$sandbox/cache" \
              HERMES_HOME="$sandbox/hermes" HERMES_RUNTIME_DIR="$sandbox/runtime" \
              HERMES_TEST_ROOT="$upstream" PYTHONDONTWRITEBYTECODE=1 PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 \
              "$test_python" -m pytest -q -p no:cacheprovider --show-capture=no \
              -o junit_logging=no --basetemp="$sandbox/pytest" --junitxml="$result" \
              "acceptance/live/test_native_$fixture.py"

            # Stage evidence only after pytest records a passing case without captured output.
            "$test_python" - "$result" <<'PY'
          import sys
          from xml.etree import ElementTree

          result = ElementTree.parse(sys.argv[1])
          excluded = ("error", "failure", "skipped", "system-out", "system-err")
          if len(result.findall(".//testcase")) != 1 or any(
              result.findall(f".//{tag}") for tag in excluded
          ):
              raise SystemExit("Expected one clean passing native Gateway case")
          PY
            install -m 600 "$result" "$RUNNER_TEMP/native-gateway-evidence/$receipt"
          done
      - name: Verify pinned native Gateway lifecycle without provider credentials
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          export HERMES_HOME="$RUNNER_TEMP/native-gateway-test-home"
          export UGW_ARTIFACT_DIR="$RUNNER_TEMP/native-gateway-evidence"
          mkdir -p "$HERMES_HOME" "$UGW_ARTIFACT_DIR"
          cd "$RUNNER_TEMP/hermes"
          "$RUNNER_TEMP/hermes-test-venv/bin/python" -m pytest -q \
            tests/gateway/test_unified_gateway_native_live.py \
            --junitxml="$UGW_ARTIFACT_DIR/results.xml"
      - name: Build and verify the current committed runtime package
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_runtime_distribution.py --source-commit "$GITHUB_SHA" \
            --output-dir "$RUNNER_TEMP/live-runtime"
          python scripts/build_runtime_distribution.py --source-commit "$GITHUB_SHA" \
            --output-dir "$RUNNER_TEMP/live-runtime" --verify
          git -C "$RUNNER_TEMP/live-runtime" init -b main
          git -C "$RUNNER_TEMP/live-runtime" add .
          git -C "$RUNNER_TEMP/live-runtime" -c user.name=Acceptance \
            -c user.email=acceptance@example.invalid commit -m 'test: stage verified runtime'
      - name: Verify installed package over real Gateway without model calls
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          export HERMES_TEST_ROOT="$RUNNER_TEMP/hermes"
          export HERMES_RUNTIME_PACKAGE="$RUNNER_TEMP/live-runtime"
          export HERMES_SOURCE_COMMIT="$GITHUB_SHA"
          "$RUNNER_TEMP/hermes-test-venv/bin/python" -m pytest -q \
            acceptance/live/test_packaged_gateway_tasks.py \
            acceptance/live/test_packaged_gateway_memory.py \
            acceptance/live/test_packaged_gateway_handoff.py \
            --junitxml="$RUNNER_TEMP/native-gateway-evidence/packaged-results.xml"
      - name: Verify installed package in the canonical Bot Chat
        timeout-minutes: 7
        shell: bash
        run: |
          set -euo pipefail
          export HERMES_TEST_ROOT="$RUNNER_TEMP/hermes"
          export HERMES_RUNTIME_PACKAGE="$RUNNER_TEMP/live-runtime"
          export HERMES_SOURCE_COMMIT="$GITHUB_SHA"
          export PYTEST_DISABLE_PLUGIN_AUTOLOAD=1
          test_python="$RUNNER_TEMP/hermes-test-venv/bin/python"
          result="$RUNNER_TEMP/packaged-bot.xml"
          "$test_python" -m pytest -q -p no:cacheprovider --show-capture=no \
            -o junit_logging=no --junitxml="$result" acceptance/live/test_packaged_gateway_bot.py
          "$test_python" - "$result" <<'PY'
          import sys
          from xml.etree import ElementTree

          result = ElementTree.parse(sys.argv[1])
          cases = result.findall(".//testcase")
          excluded = ("error", "failure", "skipped", "system-out", "system-err")
          if (
              len(cases) != 1
              or cases[0].get("name") != "test_installed_task_commands_reopen_original_canonical_bot_chat"
              or any(result.findall(f".//{tag}") for tag in excluded)
          ):
              raise SystemExit("Expected one clean passing installed Bot Chat case")
          PY
          install -m 600 "$result" "$RUNNER_TEMP/native-gateway-evidence/packaged-bot.xml"
      - name: Upload synthetic native Gateway test receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-gateway-receipt-${{ github.run_id }}
          path: ${{ runner.temp }}/native-gateway-evidence/*.xml
          if-no-files-found: warn
          retention-days: 14
