[project]
name = "hermes-personal-agent"
version = "0.1.0"
description = "Hermes-native personal agent foundation with an opt-in local task inbox"
requires-python = ">=3.14,<3.15"
license = "MIT"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ty.src]
include = ["personal_agent"]
